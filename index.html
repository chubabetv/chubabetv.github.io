<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>쮸래기 놀이터 🎪</title>
<meta property="og:title" content="쮸래기 놀이터">
<meta property="og:description" content="쮸래기랑 함께 노는 미니게임 모음 — 밸런스 게임 · 라이어 게임">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  :root{ --bg:#12101c; --card:#1e1b2e; --card2:#272341; --a1:#ff4d8d; --b1:#7b5cff; --text:#f4f2ff; --muted:#9c98b5; --good:#33d69f; --line:#332f4a; }
  html,body{height:100%;}
  body{ font-family:'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
    background:radial-gradient(120% 80% at 50% -10%,#2a2140 0%,var(--bg) 55%);
    color:var(--text); min-height:100dvh; padding:16px; }
  .wrap{ max-width:480px; width:100%; margin:0 auto; }

  .hero{ text-align:center; margin:22px 0 24px; }
  .hero .tag{ display:inline-block; font-size:12px; color:var(--muted); background:var(--card);
    border:1px solid var(--line); padding:6px 13px; border-radius:20px; margin-bottom:16px; }
  .hero h1{ font-size:38px; font-weight:900; letter-spacing:-1.5px; line-height:1.15;
    background:linear-gradient(90deg,var(--a1),var(--b1)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .hero p{ color:var(--muted); font-size:15px; margin-top:10px; }

  .games{ display:flex; flex-direction:column; gap:14px; }
  .game{ display:flex; align-items:center; gap:16px; text-decoration:none; color:var(--text);
    background:var(--card); border:1px solid var(--line); border-radius:22px; padding:20px;
    transition:.18s; position:relative; overflow:hidden; }
  .game::after{ content:'→'; position:absolute; right:20px; font-size:22px; color:var(--muted); transition:.18s; }
  .game:active{ transform:scale(.98); }
  .game:hover{ border-color:var(--b1); transform:translateY(-2px); box-shadow:0 12px 30px rgba(123,92,255,.2); }
  .game:hover::after{ color:var(--a1); transform:translateX(4px); }
  .game .ico{ width:60px;height:60px;border-radius:18px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:30px; }
  .game.balance .ico{ background:linear-gradient(135deg,#ff4d8d,#ff8a3d); }
  .game.liar .ico{ background:linear-gradient(135deg,#7b5cff,#4dc3ff); }
  .game .txt h3{ font-size:19px; font-weight:900; margin-bottom:4px; }
  .game .txt p{ font-size:13px; color:var(--muted); line-height:1.4; padding-right:20px; }
  .game .txt .badge{ display:inline-block; font-size:11px; font-weight:800; color:var(--good);
    background:rgba(51,214,159,.12); padding:2px 8px; border-radius:8px; margin-top:7px; }

  .foot-note{ text-align:center; color:var(--muted); font-size:11px; margin-top:8px; }
</style>
</head>
<body>
  <div class="wrap">
    <!-- 공통 헤더 (layout.js) -->
    <header id="site-header"></header>

    <!-- 가운데: 이 페이지 고유 내용 -->
    <div class="hero">
      <div class="tag">🎬 쮸래기 공식 놀이터</div>
      <h1>함께 노는<br>미니게임 모음</h1>
      <p>하고 싶은 게임을 골라보세요</p>
    </div>
    <div class="games">
      <a class="game balance" href="balance.html">
        <div class="ico">🎲</div>
        <div class="txt">
          <h3>밸런스 게임</h3>
          <p>순한맛 vs 매운맛 — 당신의 선택은? 진짜 고민되는 5:5</p>
          <span class="badge">실시간 투표 집계</span>
        </div>
      </a>
      <a class="game liar" href="liar.html">
        <div class="ico">🕵️</div>
        <div class="txt">
          <h3>라이어 게임</h3>
          <p>시청자 4~5명이 각자 폰으로 접속! 거짓말쟁이를 찾아라</p>
          <span class="badge">실시간 시참</span>
        </div>
      </a>
    </div>

    <!-- 공통 푸터 (layout.js) -->
    <footer id="site-footer"></footer>
    <div class="foot-note">쮸래기 놀이터 · 함께 즐기고 자유롭게 공유하세요 🎪</div>
  </div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="layout.js"></script>
</body>
</html>
